name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: build, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # marathon-mpv links the system libmpv, found with pkg-config; gilrs
      # (gamepads, in marathon-desktop) needs libudev on Linux; the
      # optional HDMI-CEC input (M7) needs libcec, whose pkg-config file
      # requires p8-platform's (not pulled in without recommends).
      - name: Install libmpv, libudev, and libcec (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmpv-dev libudev-dev libcec-dev libp8-platform-dev
      - name: Install libmpv and libcec (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv libcec pkgconf
      - run: cargo build --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The default build leaves HDMI-CEC out; check the desktop app with
      # it too (M7). Its tests need no CEC hardware.
      - name: With the input-cec feature
        run: |
          features=marathon-desktop/input-cec,marathon-input-cec/libcec
          cargo clippy -p marathon-desktop -p marathon-input-cec --all-targets --locked --features $features -- -D warnings
          cargo test -p marathon-desktop -p marathon-input-cec --locked --features $features

  # The Android client (M10, docs/ANDROID.md). Its OpenAPI snapshot and the
  # Action/Event JSON fixtures are checked against the Rust side by
  # `cargo test` in the check job above; this job builds and tests the app.
  android:
    name: android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - name: Tuner scenarios match the Rust tests
        working-directory: .
        run: scripts/check-tuner-parity.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      # The runner image has an Android SDK with its licences accepted, but
      # not necessarily the platform and build-tools this project targets;
      # install them explicitly rather than rely on the image's contents or
      # on the Android Gradle plugin downloading them mid-build.
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37" "build-tools;37.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: marathon-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  seams:
    name: platform seams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # marathon-client has no winit/glutin/gilrs dependency, and winit,
      # glutin, and gilrs appear only in marathon-desktop's platform module
      # (M3.5, M5).
      - run: scripts/check-seams.sh

  test-library:
    name: test library script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Generate library inside the repo
        run: scripts/make-test-library.sh test-library
      - name: Check layout
        run: |
          set -euo pipefail
          cd test-library
          for s in 1 2 3; do
            n=$(find "TV/Test Show/Season $s" -name 'Test Show - S0*E0* - *.mkv' | wc -l)
            [ "$n" -eq 4 ] || { echo "Season $s has $n episodes, want 4"; exit 1; }
          done
          [ -f "TV/Test Show/Season 1/Test Show - S01E01 - Pilot.en.srt" ]
          n=$(find Essays -type f | wc -l)
          [ "$n" -eq 6 ] || { echo "Essays has $n clips, want 6"; exit 1; }
          [ -f "Misc/Café Society's Ünïcode Clip — Ørsted.mkv" ]
          grep -qF "root = \"$PWD\"" marathon.toml
      - name: Generated media is ignored by git
        run: |
          status=$(git status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            echo "Generated files are not ignored:"; echo "$status"; exit 1
          fi
