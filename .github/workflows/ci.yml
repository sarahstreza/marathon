name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: build, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # marathon-mpv links the system libmpv, found with pkg-config; gilrs
      # (gamepads, in marathon-desktop) needs libudev on Linux; the
      # optional HDMI-CEC input (M7) needs libcec, whose pkg-config file
      # requires p8-platform's (not pulled in without recommends).
      - name: Install libmpv, libudev, and libcec (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmpv-dev libudev-dev libcec-dev libp8-platform-dev
      - name: Install libmpv and libcec (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv libcec pkgconf
      - run: cargo build --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The default build leaves HDMI-CEC out; check the desktop app with
      # it too (M7). Its tests need no CEC hardware.
      - name: With the input-cec feature
        run: |
          features=marathon-desktop/input-cec,marathon-input-cec/libcec
          cargo clippy -p marathon-desktop -p marathon-input-cec --all-targets --locked --features $features -- -D warnings
          cargo test -p marathon-desktop -p marathon-input-cec --locked --features $features

  # The Android client (M10, docs/ANDROID.md). Its OpenAPI snapshot and the
  # Action/Event JSON fixtures are checked against the Rust side by
  # `cargo test` in the check job above; this job builds and tests the app.
  android:
    name: android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - name: Tuner scenarios match the Rust tests
        working-directory: .
        run: scripts/check-tuner-parity.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      # The runner image has an Android SDK with its licences accepted, but
      # not necessarily the platform and build-tools this project targets;
      # install them explicitly rather than rely on the image's contents or
      # on the Android Gradle plugin downloading them mid-build.
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: marathon-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  seams:
    name: platform seams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # marathon-client has no winit/glutin/gilrs dependency, and winit,
      # glutin, and gilrs appear only in marathon-desktop's platform module
      # (M3.5, M5).
      - run: scripts/check-seams.sh

  test-library:
    name: test library script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Generate library inside the repo
        run: scripts/make-test-library.sh test-library
      - name: Check layout
        run: |
          set -euo pipefail
          cd test-library
          for s in 1 2 3; do
            n=$(find "TV/Test Show/Season $s" -name 'Test Show - S0*E0* - *.mkv' | wc -l)
            [ "$n" -eq 4 ] || { echo "Season $s has $n episodes, want 4"; exit 1; }
          done
          [ -f "TV/Test Show/Season 1/Test Show - S01E01 - Pilot.en.srt" ]
          n=$(find Essays -type f | wc -l)
          [ "$n" -eq 6 ] || { echo "Essays has $n clips, want 6"; exit 1; }
          [ -f "Misc/Café Society's Ünïcode Clip — Ørsted.mkv" ]
          grep -qF "root = \"$PWD\"" marathon.toml
      - name: Generated media is ignored by git
        run: |
          status=$(git status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            echo "Generated files are not ignored:"; echo "$status"; exit 1
          fi

  # The server's container image (Dockerfile, README "Running the server in
  # a container"): it builds, starts with the example config, and answers
  # requests.
  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: marathond:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size
        run: docker image ls marathond:ci
      - name: Refuses to listen on every interface without a token
        run: |
          set -uo pipefail
          sed '/^token/d' docker/config.toml > /tmp/notoken.toml
          if out=$(docker run --rm -v /tmp/notoken.toml:/config/config.toml:ro marathond:ci 2>&1); then
            echo "started without a token:"; echo "$out"; exit 1
          fi
          echo "$out" | grep -q 'server.token must be set'
      - name: Serves the API with the example config
        run: |
          set -euo pipefail
          docker run -d --name marathond -p 7878:7878 \
            -v "$PWD/docker/config.toml:/config/config.toml:ro" marathond:ci
          for _ in $(seq 30); do
            curl -s -o /dev/null http://127.0.0.1:7878/ && break
            sleep 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7878/api/v1/channels)
          [ "$code" = 401 ] || { echo "without a token: HTTP $code, want 401"; exit 1; }
          curl -sf -H 'Authorization: Bearer change-me' http://127.0.0.1:7878/api/v1/channels
          # /proc/1 is owned by PID 1's uid:gid, i.e. marathond's.
          ids=$(docker exec marathond stat -c %u:%g /proc/1)
          [ "$ids" = 1000:1000 ] || { echo "runs as $ids, want 1000:1000"; exit 1; }
      # The entrypoint drops to PUID:PGID and re-owns a bind-mounted /data.
      - name: Runs as PUID:PGID and owns /data
        run: |
          set -euo pipefail
          mkdir /tmp/data
          docker run -d --name marathond-ids -e PUID=1234 -e PGID=2345 \
            -v "$PWD/docker/config.toml:/config/config.toml:ro" \
            -v /tmp/data:/data marathond:ci
          for _ in $(seq 30); do
            [ -e /tmp/data/marathon.db ] && break
            sleep 1
          done
          ids=$(docker exec marathond-ids stat -c %u:%g /proc/1)
          [ "$ids" = 1234:2345 ] || { echo "runs as $ids, want 1234:2345"; exit 1; }
          bad=$(find /tmp/data \! \( -uid 1234 -gid 2345 \))
          [ -z "$bad" ] || { echo "not owned by 1234:2345:"; ls -ln /tmp/data; exit 1; }
      - name: Rejects a non-numeric PUID
        run: |
          set -uo pipefail
          if out=$(docker run --rm -e PUID=nobody marathond:ci 2>&1); then
            echo "started with PUID=nobody:"; echo "$out"; exit 1
          fi
          echo "$out" | grep -q 'PUID must be a numeric id'
      - name: Server log
        if: always()
        run: |
          docker logs marathond || true
          docker logs marathond-ids || true
