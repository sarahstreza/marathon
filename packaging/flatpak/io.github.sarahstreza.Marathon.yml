# Flatpak manifest for the Marathon desktop player (marathon-desktop).
#
# Build it with packaging/flatpak/build.sh, which first generates
# cargo-sources.json (the crates in Cargo.lock, so the build runs offline)
# and then runs flatpak-builder. See docs/PACKAGING.md.
#
# libmpv is built here (libass, libplacebo, and mpv as a library only)
# against the runtime's FFmpeg. From 25.08 on, the freedesktop runtime's
# FFmpeg gets its patent-encumbered codecs (H.264, HEVC, ...) from the
# org.freedesktop.Platform.codecs-extra extension, which Flatpak installs
# automatically alongside the runtime.
#
# The server binary (marathond) is not included: a long-running daemon
# doesn't fit Flatpak's app model. The player's embedded mode (--embedded
# --config FILE) runs a server inside the app when you need one.
id: io.github.sarahstreza.Marathon
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: marathon-desktop

finish-args:
  # Video output: Wayland, or X11 when there is no Wayland session.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU rendering and VA-API hardware decoding.
  - --device=dri
  # Gamepads (gilrs reads /dev/input through udev).
  - --device=input
  - --socket=pulseaudio
  # Talking to the Marathon server and streaming from it.
  - --share=network
  # Embedded mode reads the config and media from local folders. Videos is
  # a sensible default; grant others with `flatpak override --filesystem`.
  - --filesystem=xdg-videos:ro
  # mpv parses numbers with the C locale's decimal point.
  - --env=LC_NUMERIC=C

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'

modules:
  - name: libass
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
        sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc
        x-checker-data:
          type: anitya
          project-id: 1560
          stable-only: true
          url-template: https://github.com/libass/libass/releases/download/$version/libass-$version.tar.xz

  # mpv's gpu-next renderer (and since 0.37 a hard requirement). Built
  # from git for its submodules (glad, jinja, fast_float, Vulkan headers).
  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Ddemos=false
      - -Dtests=false
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.387.0
        commit: 275f7dea27924cdd34ab2e6c20e448b6bc4fab65
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  # libmpv only: no mpv player, scripting, or manual.
  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dmanpage-build=disabled
      - -Dhtml-build=disabled
      - -Dbuild-date=false
    cleanup:
      - /share
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.42.0
        commit: b0841e8c4d156b8403dc1876c4cbd9011eb583f3
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - name: marathon
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/marathon/cargo
        CARGO_NET_OFFLINE: 'true'
        # As in the Dockerfile: a smaller, faster binary without touching
        # the workspace's own release profile.
        CARGO_PROFILE_RELEASE_LTO: fat
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
        CARGO_PROFILE_RELEASE_STRIP: symbols
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml
      - cargo build --offline --release --locked -p marathon-desktop
      - install -Dm755 target/release/marathon-desktop -t ${FLATPAK_DEST}/bin
      - install -Dm644 packaging/linux/${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 packaging/linux/${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dm644 packaging/linux/${FLATPAK_ID}.svg -t ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps
    sources:
      # The working tree, so local changes build without committing.
      # Build outputs and the other clients are skipped: target/ alone can
      # be gigabytes.
      - type: dir
        path: ../..
        skip:
          - .git
          - target
          - android
          - test-library
          - packaging/flatpak/.build
          - packaging/flatpak/.flatpak-builder
          - packaging/flatpak/cargo-sources.json
          - packaging/appimage/.build
      # Generated by build.sh from Cargo.lock; not committed.
      - cargo-sources.json
