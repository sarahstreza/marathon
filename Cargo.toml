[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates. The allowed edges between these are enforced by
# apps/marathond/tests/dependency_graph.rs (see PLAN.md §4).
marathon-api = { path = "crates/marathon-api" }
marathon-rules = { path = "crates/marathon-rules" }
marathon-server = { path = "crates/marathon-server" }
marathon-client = { path = "crates/marathon-client" }
marathon-mpv = { path = "crates/marathon-mpv" }

# External crates.
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
clap = { version = "4.6.7", features = ["derive"] }
http-body-util = "0.1.5"
oas3 = "0.22.0"
pkg-config = "0.3.34"
proptest = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "fs", "io-util", "time"] }
toml = "1.2.1"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = "6.0.0"
uuid = { version = "1.29.2", features = ["v4", "v7"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# The rules property tests run thousands of `next` calls over up to 200
# items, each of which sorts the items in natural order. Unoptimised, that
# takes minutes; optimising just this crate in dev/test builds brings it to
# seconds without slowing down the rest of the workspace's compile.
[profile.dev.package.marathon-rules]
opt-level = 2
