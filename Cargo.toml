[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates. The allowed edges between these are enforced by
# apps/marathond/tests/dependency_graph.rs (see PLAN.md §4).
marathon-api = { path = "crates/marathon-api" }
marathon-rules = { path = "crates/marathon-rules" }
marathon-server = { path = "crates/marathon-server" }
marathon-client = { path = "crates/marathon-client" }
marathon-mpv = { path = "crates/marathon-mpv" }

# External crates.
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
# The overlay (M5). egui_glow without its `winit` feature is only a GL
# painter, so the overlay needs no windowing library (PLAN.md §2
# decision 7). egui 0.37 needs Rust 1.95, and bundles its fonts only with
# `default_fonts` (no longer a default feature); without it no text draws.
egui = { version = "0.37.0", features = ["default_fonts"] }
egui_glow = { version = "0.37.0", default-features = false }
# Gamepads (M5); used only in marathon-desktop's platform module. Needs
# libudev on Linux.
gilrs = "0.11.2"
# Windowing and GL. egui pins these: egui_glow 0.37 needs glow ^0.17 (and
# egui-winit 0.37, unused, winit ^0.30.13), and glutin-winit 0.5 pairs
# glutin 0.32 with winit 0.30. Upgrade them together, egui first.
glow = "0.17.0"
glutin = "0.32.3"
glutin-winit = "0.5.0"
# Streams for Server-Sent Events (server) and the control channel's
# WebSocket (client).
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
http-body-util = "0.1.5"
oas3 = "0.22.0"
pkg-config = "0.3.34"
proptest = "1.12.0"
raw-window-handle = "0.6.2"
regex = "1.13.1"
# Blocking client for the desktop tuner thread; rustls so no system OpenSSL.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "fs", "io-util", "time"] }
# The client end of the control channel (M6). Kept on the version axum's
# `ws` feature uses (axum 0.8.9: 0.29), so there is one copy; upgrade with
# axum.
tokio-tungstenite = "0.29.0"
toml = "1.2.1"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = "6.0.0"
uuid = { version = "1.29.2", features = ["v4", "v7"] }
winit = "0.30.13"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# The rules property tests run thousands of `next` calls over up to 200
# items, each of which sorts the items in natural order. Unoptimised, that
# takes minutes; optimising just this crate in dev/test builds brings it to
# seconds without slowing down the rest of the workspace's compile.
[profile.dev.package.marathon-rules]
opt-level = 2
