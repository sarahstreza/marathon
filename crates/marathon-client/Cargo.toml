[package]
name = "marathon-client"
description = "Marathon client library: API client, Tuner state machine, Player trait, actions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
marathon-api.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["input-keyboard", "input-mouse", "input-gamepad"]
# Keyboard bindings as an InputSource (the windowing layer feeds it keys).
input-keyboard = []
# Mouse wheel and click bindings as an InputSource (fed by the windowing
# layer).
input-mouse = []
# Gamepad button bindings. Only the mapping: the gamepad library and its
# InputSource live in the app's platform layer (PLAN.md §2 decision 7).
input-gamepad = []
