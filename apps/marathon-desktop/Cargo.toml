[package]
name = "marathon-desktop"
description = "Marathon desktop client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
marathon-api.workspace = true
marathon-client = { workspace = true, features = ["input-keyboard", "input-mouse", "remote"] }
marathon-mpv.workspace = true
# For --embedded: runs the server in-process (PLAN.md §9).
marathon-server.workspace = true
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
egui.workspace = true
egui_glow.workspace = true
gilrs = { workspace = true, optional = true }
glow.workspace = true
glutin.workspace = true
glutin-winit.workspace = true
raw-window-handle.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
winit.workspace = true

[dev-dependencies]
# The remote-control tests post actions and restart a server on a fixed
# port.
reqwest.workspace = true
tempfile.workspace = true
tokio.workspace = true

[features]
default = ["input-gamepad"]
# Gamepad input through gilrs (needs libudev on Linux).
input-gamepad = ["dep:gilrs", "marathon-client/input-gamepad"]
