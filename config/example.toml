# Example Marathon configuration. See PLAN.md §5.
#
# Config is authoritative for source and channel definitions; playback state
# lives in the SQLite database under `data_dir`.

[server]
bind = "127.0.0.1:7878"
data_dir = "~/.local/share/marathon"   # SQLite lives here
# token = "change-me"                  # required if bind is not loopback

# A filesystem source. Mounted SMB/NFS shares work as ordinary paths.
[[source]]
id = "nas"
kind = "filesystem"
root = "/mnt/nas/video"

# A Jellyfin server (uncomment to use). Each library shows up as a folder
# named after it, holding the same folders as on the Jellyfin server, so a
# channel selects e.g. `path = "Shows/The Office (US)"`. Episode numbers,
# titles, and durations come from Jellyfin, and Marathon streams the
# original files through itself (never a transcode). Create the API key in
# Jellyfin's Dashboard → API Keys; it is never logged or shown by the API.
# [[source]]
# id = "jellyfin"
# kind = "jellyfin"
# url = "http://jellyfin.lan:8096"
# api_key = "0123456789abcdef0123456789abcdef"
# libraries = ["Shows", "Films"]       # optional; default: every library

# Channel `items` select files from a source. A `path` naming a folder picks
# up the videos directly in it plus those in its `Season N` subfolders, so a
# show laid out as `Show/Season 1/...` needs no `recursive`. Add
# `recursive = true` to include every subfolder at any depth.

# Plays episodes in season/episode order, looping at the end.
[[channel]]
id = "office"
number = 1
name = "The Office"
items = [{ source = "nas", path = "TV/The Office (US)" }]
rule = { kind = "ordered" }

# Picks seasons in random order, playing each season's episodes in order.
[[channel]]
id = "taskmaster"
number = 6
name = "Taskmaster"
items = [{ source = "nas", path = "TV/Taskmaster" }]
rule = { kind = "grouped", by = "season", groups = "shuffled", within = "ordered" }

# Bag shuffle across two folders (and their subfolders).
[[channel]]
id = "essays"
number = 3
name = "Game Design Essays"
items = [
  { source = "nas", path = "YouTube/Game Design", recursive = true },
  { source = "nas", path = "YouTube/Level Design", recursive = true },
]
rule = { kind = "shuffled" }
